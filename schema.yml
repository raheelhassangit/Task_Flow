  /api/v1/tasks/:
    get:
      operationId: v1_tasks_list
      parameters:
      - in: query
        name: assigned_to
        schema:
          type: number
      - in: query
        name: created_by
        schema:
          type: number
      - in: query
        name: due_after
        schema:
          type: string
          format: date
      - in: query
        name: due_before
        schema:
          type: string
          format: date
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: overdue
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - high
          - low
          - medium
        description: |-
          * `low` - Low
          * `medium` - Medium
          * `high` - High
      - in: query
        name: project
        schema:
          type: number
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - done
          - in_progress
          - todo
        description: |-
          * `todo` - To do
          * `in_progress` - In progress
          * `done` - Done
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
